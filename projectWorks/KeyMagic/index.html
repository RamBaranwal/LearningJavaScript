<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Keyboard Event Checker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #111827, #020617);
            color: #ffffff;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }
        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #67e8f9;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 17px;
            margin-bottom: 35px;
        }
        #insert {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }
        #insert p {
            color: #cbd5e1;
            font-size: 18px;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 12px;
        }
        th {
            background: #0891b2;
            color: white;
            padding: 16px;
            font-size: 16px;
        }
        td {
            background: #1e293b;
            color: #e2e8f0;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #334155;
        }
        tr:last-child td {
            border-bottom: none;
        }
        td:first-child {
            color: #67e8f9;
        }
        .color {
            width: 100%;
        }
        .hint {
            margin-top: 25px;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⌨ Keyboard Event Checker</h1>
        <p class="subtitle">
            Press any key on your keyboard to see its information
        </p>
        <div id="insert">
            <p>Press a key to get started...</p>
        </div>
        <p class="hint">
            Try pressing letters, numbers, Shift, Enter, Space, Arrow keys, etc.
        </p>
    </div>
    <script src="chaiaurcode.js"></script>
</body>
</html>
