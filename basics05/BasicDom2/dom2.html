<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM (Document Object Model)</title>
</head>
<body style="background: black; color: white">

</body>
<script>
    const div = document.createElement('div');
    console.log(div);
    div.setAttribute('class', 'parent');   // firstly it will be set this then next one
    div.className = "child";     // this is set after the first one overright
    div.id = Math.floor(Math.random() * 10 + 1);
    div.setAttribute("title", 'newTitle');
    div.style.background = "orange";
    div.style.color = "purple";
    div.style.padding = "12px";

    div.innerHTML = "Chai aur Code";        // this is normally adding

    const addText = document.createTextNode("Chai aur Code");
    div.appendChild(addText);
    // this is firstly create node then append it into div as child node

    document.body.appendChild(div);
</script>
</html>
